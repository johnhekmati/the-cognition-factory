name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      # wrangler pages deploy uploads the whole directory and does NOT honor
      # .wranglerignore — prune operator-only folders so they never go public.
      - name: Prune non-public files
        run: |
          rm -rf docs mcps workers scripts src node_modules terminals
          rm -f package.json package-lock.json wrangler.jsonc tailwind.config.js
          rm -f CHANGELOG.md README.md .gitignore .wranglerignore
          rm -rf .github
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --project-name=the-cognition-factory --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

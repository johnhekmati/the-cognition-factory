name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_* secrets not set. Deploy skipped (green). Stamp secrets, then re-run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.cf.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cf.outputs.skip != 'true'
        run: npm ci

      - name: Build Tailwind CSS
        if: steps.cf.outputs.skip != 'true'
        run: npm run build

      # wrangler pages deploy uploads the whole directory and does NOT honor
      # .wranglerignore — prune operator-only folders so they never go public.
      # Keep wrangler.jsonc (pages_build_output_dir). Always pass "." to deploy.
      - name: Prune non-public files
        if: steps.cf.outputs.skip != 'true'
        run: |
          rm -rf docs mcps workers scripts src node_modules terminals
          rm -f package.json package-lock.json tailwind.config.js
          rm -f CHANGELOG.md README.md .gitignore .wranglerignore
          rm -rf .github
          rm -f tailwindcss.exe tailwindcss
          # Belt: never ship nested git metadata if present
          rm -rf .git 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.skip != 'true'
        run: npx wrangler pages deploy . --project-name=the-cognition-factory --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  <!--
    Critical hero first-paint (mobile + desktop).
    Full hero rules also live in the page foot style block; this block must stay in <head>
    so slides never stack in document flow before CSS arrives (was causing 19k–31k px
    height jumps, blank/white flash, and ghosted carousel on mobile).
  -->
  <link
    rel="preload"
    as="image"
    href="/assets/images/hero-slides/mobile/adult-learners.jpg?v=mhero1"
    media="(max-width: 767px)"
    fetchpriority="high"
  />
  <link
    rel="preload"
    as="image"
    href="/assets/images/hero-slides/adult-learners.jpg?v=marks2"
    media="(min-width: 768px)"
    fetchpriority="high"
  />
  <style id="hero-first-paint">
    #hero { --hero-nav-h: 4rem; --hero-field: #e8eaee; }
    @media (min-width: 768px) {
      #hero { --hero-nav-h: 5rem; }
    }
    .hero-landing {
      display: flex;
      flex-direction: column;
      background: var(--hero-field, #e8eaee);
    }
    /* Mobile: do not force full viewport min-height (adds void + thrash with tall posters) */
    @media (min-width: 768px) {
      .hero-landing {
        min-height: calc(100svh - var(--hero-nav-h));
      }
    }
    .hero-banner-plate {
      position: relative;
      overflow: hidden;
      background: var(--hero-field, #e8eaee);
    }
    .hero-slide-stage {
      position: relative;
      width: 100%;
      height: min(calc(100vw * 9 / 16), calc(100svh - var(--hero-nav-h) - 3.5rem));
      min-height: 12rem;
      max-height: min(calc(100vw * 9 / 16), calc(100svh - var(--hero-nav-h) - 3.5rem));
      background: var(--hero-field, #e8eaee);
      overflow: hidden;
      isolation: isolate;
      contain: layout style;
    }
    @media (max-width: 767px) {
      .hero-slide-stage {
        height: min(calc(100vw * 1904 / 1264), calc(100svh - var(--hero-nav-h) - 3.25rem));
        max-height: min(calc(100vw * 1904 / 1264), calc(100svh - var(--hero-nav-h) - 3.25rem));
        min-height: 16rem;
      }
    }
    .hero-slides {
      position: absolute;
      inset: 0;
    }
    .hero-slide {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--hero-field, #e8eaee);
      /* No transition until stage is ready — prevents ghost crossfades on first paint */
      transition: none;
      pointer-events: none;
    }
    .hero-slide.is-active {
      opacity: 1;
      visibility: visible;
      z-index: 1;
      pointer-events: auto;
    }
    .hero-slide-stage.is-ready .hero-slide {
      transition: opacity 0.45s ease;
    }
    @media (min-width: 768px) {
      .hero-slide-stage.is-ready .hero-slide {
        transition: opacity 0.75s ease;
      }
    }
    .hero-slide picture {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .hero-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }
  </style>
</head>

      }
    }

    /* Flat charcoal CF — Edge-style: no plate, no box, no radius card */
    .brand-nav-mark {
      height: 2.35rem;
      width: 2.35rem;
      object-fit: cover;
      object-position: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      /* Drop light plate so only charcoal monogram reads on paper */
      mix-blend-mode: multiply;
      opacity: 0.95;
      transition: opacity 0.2s ease;
    }

    .brand-nav-mark:hover,
    a:hover .brand-nav-mark {
      opacity: 1;
    }

    @media (min-width: 768px) {
      .brand-nav-mark {
        height: 2.5rem;
        width: 2.5rem;
      }
    }

    footer .brand-nav-mark {
      height: 2rem;
      width: 2rem;
      opacity: 0.88;
    }

    /* Connect triad labels — full width under banner */
    .doors-caption {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      width: 100%;
      margin-top: 0.75rem;
    }

    .doors-caption .ritual-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    /* Mark triad — gold / green / red (matches door marks) */
    .ritual-chip--map {
      border-color: #c9a227 !important;
      color: #5c4a0c !important;
      background: #fffdf5 !important;
    }

    .ritual-chip--practice {
      border-color: #3d8c5a !important;
      color: #145032 !important;
      background: #f4fbf6 !important;
    }

    .ritual-chip--save {
      border-color: #b03030 !important;
      color: #6e1818 !important;
      background: #fff6f6 !important;
    }

    @media (min-width: 768px) {
      .hero-slide-dots {
        bottom: 1rem;
        gap: 0.5rem;
      }
    }

    .hero-video-stage.hero-mark-stage {
      /* positioned by .hero-mark-stage — relative flow inside plate */
      border-radius: 0;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      z-index: 1;
      /* Punchier mark on void (less washed) */
      filter: brightness(1.08) saturate(1.22) contrast(1.04);
      transform: none;
      transition: opacity 0.6s ease;
      will-change: opacity;
    }

    img.hero-video {
      opacity: 1;
      z-index: 3;
    }

    .hero-video.is-active {
      opacity: 1;
      z-index: 3;
      transform: none;
    }

    .hero-video.is-exiting {
      opacity: 0;
      z-index: 2;
      transform: none;
    }

    .hero-video-fade {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 65%, rgba(5, 8, 16, 0.8) 100%);
      border-radius: inherit;
    }

    .hero-engine-badge {
      position: absolute;
      bottom: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      margin: 0;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid rgba(0, 212, 255, 0.35);
      background: rgba(5, 8, 16, 0.72);
      backdrop-filter: blur(12px);
      font-family: JetBrains Mono, ui-monospace, monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00d4ff;
      white-space: nowrap;
      transition: opacity 0.4s ease;
      max-width: calc(100% - 1.5rem);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-video {
        transition: none;
        transform: none;
        filter: brightness(1.05) saturate(1.05);
        /* Single-clip hero: keep the only video visible (show poster / paused frame) */
        opacity: 1 !important;
        display: block !important;
      }
      [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }

    [data-reveal] {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    [data-reveal].revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* No-JS / script blocked: content still readable */
    @media (scripting: none) {
      [data-reveal] {
        opacity: 1 !important;
        transform: none !important;
      }
    }

    .resource-card.is-hidden {
      display: none;
    }
  </style>

  <!-- Product gallery lightbox -->
  <div
    id="product-lightbox"
    class="product-lightbox"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="product-lightbox-caption"
  >
    <button type="button" class="product-lightbox__backdrop" data-lightbox-close aria-label="Close enlarged photo"></button>
    <div class="product-lightbox__frame">
      <button type="button" class="product-lightbox__close" data-lightbox-close aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
      <img id="product-lightbox-img" class="product-lightbox__img" src="" alt="" />
      <p id="product-lightbox-caption" class="product-lightbox__caption"></p>
    </div>
  </div>

  <script src="/js/main.js?v=hero-paint1" defer></script>
  <noscript>
    <style>
      [data-reveal] { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>
</body>
</html>
